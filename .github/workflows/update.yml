name: App veröffentlichen

# Veröffentlicht die App (Ordner public/) auf GitHub Pages – nach jeder Änderung und per Knopfdruck.
# Die Verbindung zu WebUntis läuft über den Cloudflare Worker (worker/), nicht über GitHub.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deploy
        uses: actions/deploy-pages@v4
