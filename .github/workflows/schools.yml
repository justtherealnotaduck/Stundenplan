name: Schulliste aktualisieren

# Einmal im Monat die Liste für die Schulvorschläge neu aufbauen (dauert ca. 15 Minuten)
on:
  schedule:
    - cron: '17 2 1 * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: schools
  cancel-in-progress: false

jobs:
  schools:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Schulen sammeln
        run: node scripts/build-schools.js

      - name: Speichern und App neu veröffentlichen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/schools.json
          git commit -m "Schulliste aktualisiert" || exit 0
          git pull --rebase
          git push
          gh workflow run update.yml --repo "$GITHUB_REPOSITORY" --ref main
