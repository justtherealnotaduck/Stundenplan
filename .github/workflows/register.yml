name: Anmeldung

# Neue Nutzer eröffnen über die App ein Issue mit dem Titel „Anmeldung“ und ihrem verschlüsselten Code.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: register
  cancel-in-progress: false

jobs:
  register:
    if: startsWith(github.event.issue.title, 'Anmeldung')
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Vienna
      GH_TOKEN: ${{ github.token }}
      NUMBER: ${{ github.event.issue.number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Issue-Text nur als Umgebungsvariable übergeben, nie direkt in Befehle einsetzen
      - id: reg
        name: Anmeldecode prüfen
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          REGISTER_PRIVATE_KEY: ${{ secrets.REGISTER_PRIVATE_KEY }}
        run: node scripts/register.js

      - name: Code aus dem Issue entfernen
        if: always()
        run: gh issue edit "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "Der Anmeldecode wurde entfernt."

      - name: Zugang speichern
        if: steps.reg.outputs.result == 'ok'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add users
          git commit -m "Zugang hinzugefügt oder aktualisiert" || exit 0
          git pull --rebase
          git push

      - name: Daten gleich holen
        if: steps.reg.outputs.result == 'ok'
        run: gh workflow run update.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Antworten und Issue schließen
        if: always()
        env:
          RESULT: ${{ steps.reg.outputs.result }}
          MESSAGE: ${{ steps.reg.outputs.message }}
        run: |
          if [ "$RESULT" = "ok" ]; then text="✅ $MESSAGE"; else text="❌ ${MESSAGE:-Die Anmeldung hat nicht geklappt.} Bitte in der App einen neuen Code erzeugen und es noch einmal versuchen."; fi
          gh issue comment "$NUMBER" --repo "$GITHUB_REPOSITORY" --body "$text"
          gh issue close "$NUMBER" --repo "$GITHUB_REPOSITORY"
