<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e9e7e2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#07080a" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Stundenplan">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <title>Mein Stundenplan</title>
  <link rel="stylesheet" href="fonts/fonts.css">
  <script src="config.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Fließender Hintergrund + Lichtbrechung für das Glas -->
  <div class="aurora" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
  <svg class="defs" width="0" height="0" aria-hidden="true">
    <filter id="liquid" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.005 0.008" numOctaves="2" seed="7" result="noise"/>
      <feGaussianBlur in="noise" stdDeviation="2.5" result="soft"/>
      <feDisplacementMap in="SourceGraphic" in2="soft" scale="46" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </svg>
  <!-- Login -->
  <main id="login-view" class="login" hidden>
    <form id="login-form" class="card login-card" autocomplete="on">
      <div class="wordmark big">stundenplan<span>.</span></div>
      <h1>Willkommen zurück.</h1>
      <p class="muted">Melde dich mit deinem WebUntis-Konto an.</p>

      <label class="field">
        <span>Schule</span>
        <input id="school-input" type="text" placeholder="Schulname oder Ort suchen…" autocomplete="off" required>
        <ul id="school-results" class="results" hidden></ul>
      </label>

      <label class="field">
        <span>Benutzername</span>
        <input id="user-input" name="username" type="text" autocomplete="username" required>
      </label>

      <label class="field">
        <span>Passwort</span>
        <input id="password-input" name="password" type="password" autocomplete="current-password" required>
      </label>

      <label class="check" id="remember-row" hidden><input id="remember" type="checkbox"> Auf diesem Gerät angemeldet bleiben</label>
      <p id="login-error" class="error" hidden></p>
      <button id="login-btn" class="btn primary" type="submit">Anmelden</button>
      <p class="hint"><span id="login-hint">Deine Daten werden direkt an WebUntis weitergeleitet und nirgends gespeichert.</span><br>Inoffiziell – nicht mit Untis verbunden. · <a href="rechtliches.html">Datenschutz & Offenlegung</a></p>
    </form>

  </main>

  <!-- App -->
  <div id="app-view" class="shell" hidden>
    <aside id="sidebar" class="sidebar">
      <div class="sb-head">
        <div class="wordmark">stundenplan<span>.</span></div>
        <div class="sb-school"><span id="school-name"></span></div>
      </div>
      <div id="school-year" class="year-pill"></div>
      <nav id="nav" class="nav"></nav>
      <div class="sb-foot">
        <div class="me"><span class="avatar" id="avatar"></span><span id="who"></span></div>
        <div class="sb-actions">
          <button class="btn icon" id="theme-btn" aria-label="Design wechseln" title="Hell/Dunkel">◐</button>
          <button class="btn ghost" id="logout-btn">Abmelden</button>
        </div>
        <div class="sb-legal">
          <a href="rechtliches.html">Datenschutz & Offenlegung</a>
        </div>
      </div>
    </aside>
    <div id="scrim" class="scrim" hidden></div>

    <div class="main">
      <header class="topbar">
        <button class="btn icon menu-btn" id="menu-btn" aria-label="Menü">☰</button>
        <h1 id="view-title"></h1>
        <button class="avatar me-btn" id="me-btn" aria-label="Profil und mehr"></button>
        <div id="view-tools" class="view-tools"></div>
      </header>
      <main id="view" class="view"></main>
    </div>

    <!-- Nur im Handy-Modus: Tab-Leiste unten und „Mehr“-Fenster -->
    <nav id="tabbar" class="tabbar" aria-label="Hauptnavigation"></nav>
    <section id="sheet" class="sheet" aria-label="Mehr" aria-hidden="true">
      <div class="sheet-handle"></div>
      <div class="sheet-me">
        <span class="avatar" id="sheet-avatar"></span>
        <div><b id="sheet-name"></b><small id="sheet-school"></small></div>
      </div>
      <nav id="sheet-nav" class="sheet-nav"></nav>
      <div class="sheet-actions">
        <button class="btn" data-action="theme">◐ Hell / Dunkel</button>
        <button class="btn" data-action="logout">Abmelden</button>
      </div>
      <div class="sheet-legal">
        <a href="rechtliches.html">Datenschutz & Offenlegung</a>
      </div>
    </section>
  </div>

  <div id="bubble" class="bubble" role="status" hidden></div>

  <!-- Details -->
  <dialog id="details">
    <div id="details-body"></div>
    <form method="dialog"><button class="btn">Schließen</button></form>
  </dialog>

  <script src="app.js"></script>
  <script src="homework.js"></script>
  <script src="learn.js"></script>
</body>
</html>
